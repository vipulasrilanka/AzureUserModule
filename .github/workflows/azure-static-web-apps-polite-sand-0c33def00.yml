name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Generate Version Info
        run: |
          echo "window.APP_VERSION = '1.0.0';" > client/version.js
          echo "window.DEPLOY_TIME = '$(date -u +"%Y-%m-%d %H:%M:%S UTC")';" >> client/version.js
      
      - name: Generate Config File
        run: |
          echo "window.APP_CONFIG = {" > client/config.js
          echo "  AZURE_FUNCTION_URL: '${{ secrets.AZURE_FUNCTION_URL }}'," >> client/config.js
          echo "  AZURE_FUNCTION_KEY: '${{ secrets.AZURE_FUNCTION_KEY }}'," >> client/config.js
          echo "  GET_DEVICE_URL: '${{ secrets.GET_DEVICE_URL }}'," >> client/config.js
          echo "  GET_DEVICE_KEY: '${{ secrets.GET_DEVICE_KEY }}'," >> client/config.js
          echo "  SET_DEVICE_URL: '${{ secrets.SET_DEVICE_URL }}'," >> client/config.js
          echo "  SET_DEVICE_KEY: '${{ secrets.SET_DEVICE_KEY }}'" >> client/config.js
          echo "};" >> client/config.js
      
      - name: Cleanup Staging Environments
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_SAND_0C33DEF00 }}
          action: "close"
          app_location: "client"
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_SAND_0C33DEF00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          output_location: "."

  close_pull_request_job:
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    needs: build_and_deploy_job
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_SAND_0C33DEF00 }}
          action: "close"
          app_location: "client"
